# Dataset
dataset_name: ETTh1
csv_path: data/ETT-small/ETTh1.csv

# Finestre temporali
seq_len: 96
pred_len: 24

# DataLoader
batch_size: 32
num_workers: 0
shuffle_train: true
drop_last_train: true

# Dataset e modello
num_features: 7

# Training
epochs: 20
learning_rate: 0.001
weight_decay: 0.0

# Riproducibilità
seed: 42

# Parametri period-aware
top_k: 3
use_fft: true
fixed_period: 24
use_inception: true

# Dimensioni interne del modello 2D
d_model: 32
d_ff: 64
kernel_sizes: [1, 3, 5]
dropout: 0.1